<style>

            animation: ring 2s ease-in-out infinite;

            20% { transform: rotate(-15deg); }
            30% { transform: rotate(10deg); }
            40% { transform: rotate(-10deg); }
            50% { transform: rotate(0); }
            100% { transform: rotate(0); }
        }

        .success-overlay {
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);

<script>
        function handleAllow() {
            const card = document.getElementById('permissionCard');
            const overlay = document.getElementById('successOverlay');

            // Trigger visual permission simulation
            card.classList.add('opacity-0', 'scale-95', 'pointer-events-none');
            
            setTimeout(() => {
                overlay.classList.add('active');
                
                // Add a little celebratory sparkle interaction
                createSparkles();
            }, 300);

            // Simulation: auto-close or move on after 2.5 seconds
            setTimeout(() => {
                console.log("Navigating to next flow...");
                // In a real app: window.location.href = '/dashboard';
            }, 2800);
        }

        function handleNotNow() {
            const card = document.getElementById('permissionCard');
            card.style.transform = "translateY(20px)";
            card.style.opacity = "0";
            
            setTimeout(() => {
                alert("We'll ask you again later!");
                // Reset for demo purposes
                card.style.transform = "translateY(0)";
                card.style.opacity = "1";
            }, 500);
        }

        function createSparkles() {
            const overlay = document.getElementById('successOverlay');
            for(let i = 0; i < 12; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'absolute w-1 h-1 bg-primary rounded-full';
                sparkle.style.left = '50%';
                sparkle.style.top = '50%';
                
                const angle = Math.random() * Math.PI * 2;
                const distance = 80 + Math.random() * 100;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                
                overlay.appendChild(sparkle);
                
                sparkle.animate([
                    { transform: 'translate(-50%, -50%) scale(0)', opacity: 1 },
                    { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(1.5)`, opacity: 0 }
                ], {
                    duration: 1000,
                    easing: 'cubic-bezier(0, 0, 0.2, 1)',
                    fill: 'forwards'
                });
            }
        }
    </script>
