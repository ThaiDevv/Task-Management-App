<script>
        // Micro-interaction for the notepad illustration
        document.querySelector('.floating-anim').addEventListener('mouseover', function() {
            this.style.animationPlayState = 'paused';
            this.style.transform = 'scale(1.02)';
            this.style.transition = 'transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
        });
        
        document.querySelector('.floating-anim').addEventListener('mouseout', function() {
            this.style.animationPlayState = 'running';
            this.style.transform = 'scale(1)';
        });

        // Simulating the '+' button click
        document.querySelector('button.group').addEventListener('click', function() {
            const icon = this.querySelector('.material-symbols-outlined');
            icon.innerText = 'check';
            setTimeout(() => {
                icon.innerText = 'add';
            }, 1000);
        });
    </script>
