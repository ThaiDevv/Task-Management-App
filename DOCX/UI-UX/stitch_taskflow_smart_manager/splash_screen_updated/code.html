<style>
        .splash-gradient {
            background: linear-gradient(135deg, #105cdb 0%, #0040a1 100%);
        }
        
        @keyframes pulse-ring {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 20px rgba(255, 255, 255, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
            }
        }

        @keyframes fade-in-up {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .animate-fade-in-up {
            animation: fade-in-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
    </style>
</head>
<body class="bg-background font-body-base text-on-surface antialiased w-screen h-screen overflow-hidden flex items-center justify-center splash-gradient">
<!-- Splash Content Container -->
<div class="flex flex-col items-center justify-center space-y-gutter z-10 w-full max-w-sm mx-auto px-margin-mobile">
<!-- Logo Container with Animation -->
<div class="relative w-32 h-32 flex items-center justify-center mb-4 animate-fade-in-up">
<!-- Pulsing background ring -->
<div class="absolute inset-0 bg-white/20 rounded-2xl animate-pulse-ring"></div>

            TaskFlow
        </h1>
<!-- Tagline -->
<p class="font-headline-lg text-headline-lg text-white/90 text-center opacity-0 animate-fade-in-up delay-200 tracking-wide font-light">
            Smart Task Management
        </p>
<!-- Loading Indicator -->
<div class="mt-12 flex space-x-2 opacity-0 animate-fade-in-up delay-200 pt-8">
<div class="w-2 h-2 rounded-full bg-white animate-bounce" style="animation-delay: 0ms;"></div>
<div class="w-2 h-2 rounded-full bg-white/70 animate-bounce" style="animation-delay: 150ms;"></div>
<div class="w-2 h-2 rounded-full bg-white/40 animate-bounce" style="animation-delay: 300ms;"></div>
</div>
</div>
<!-- Decorative background elements for speed/flow feel -->
<div class="absolute inset-0 overflow-hidden pointer-events-none opacity-20">
<div class="absolute -top-24 -right-24 w-96 h-96 bg-white rounded-full mix-blend-overlay filter blur-3xl opacity-50 transform translate-x-10 -translate-y-10"></div>
<div class="absolute -bottom-32 -left-32 w-[500px] h-[500px] bg-primary-fixed-dim rounded-full mix-blend-overlay filter blur-3xl opacity-40"></div>
</div>
<script>
        // Simulate app loading and redirect/transition (for demonstration)
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                // In a real app, this would route to the main dashboard
                console.log('App initialized, ready for transition');
                document.body.style.opacity = '0';
                document.body.style.transition = 'opacity 0.5s ease';
